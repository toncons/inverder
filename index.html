<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Invaders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Press Start 2P for Retro Arcade Vibe -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #05050a;
            color: #ffffff;
            overflow-x: hidden;
            user-select: none;
        }
        .arcade-glow {
            box-shadow: 0 0 20px rgba(0, 255, 128, 0.3), inset 0 0 15px rgba(0, 255, 128, 0.2);
        }
        .scanline {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.3) 50%,
                rgba(0, 0, 0, 0.3)
            );
            background-size: 100% 4px;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-2 sm:p-4 scanline m-0 overflow-hidden">

    <header class="w-full max-w-7xl flex flex-col sm:flex-row items-center justify-between bg-zinc-900/90 border-2 border-emerald-500/50 rounded-xl px-4 py-2 mb-2 backdrop-blur shadow-lg z-20">
        <div class="text-emerald-400 text-sm sm:text-lg font-bold tracking-widest mb-1 sm:mb-0 flex items-center gap-2">
            <span>👾</span> SPACE INVADERS
        </div>
        <div class="flex gap-4 sm:gap-6 text-xs sm:text-sm">
            <div class="flex flex-col items-center">
                <span class="text-zinc-400 text-[9px] sm:text-[10px]">SCORE</span>
                <span id="scoreVal" class="text-yellow-400 font-bold">000000</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-zinc-400 text-[9px] sm:text-[10px]">HI-SCORE</span>
                <span id="hiScoreVal" class="text-emerald-400 font-bold">000000</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-zinc-400 text-[9px] sm:text-[10px]">LIVES</span>
                <div id="livesContainer" class="flex gap-1 text-red-500 text-xs sm:text-sm mt-0.5">❤️ ❤️ ❤️</div>
            </div>
        </div>
    </header>

    <main class="relative flex-1 w-full h-full flex flex-col items-center justify-center p-0 m-0">
        <div class="relative w-full h-full bg-black border-2 border-emerald-500 rounded-none sm:rounded-2xl arcade-glow overflow-hidden flex items-center justify-center">
            
            <!-- Canvas for Game Rendering -->
            <canvas id="gameCanvas" class="w-full h-full block bg-[#0a0a16]"></canvas>

            <!-- Overlay for Start / Game Over / Pause Screens -->
            <div id="screenOverlay" class="absolute inset-0 bg-black/85 flex flex-col items-center justify-center p-6 text-center z-30 transition-opacity duration-300">
                <h1 id="overlayTitle" class="text-xl sm:text-3xl text-emerald-400 mb-4 animate-pulse leading-relaxed">SPACE INVADERS</h1>
                <p id="overlaySubtitle" class="text-[10px] sm:text-xs text-zinc-300 mb-6 leading-relaxed max-w-md">
                    DEFEND EARTH FROM THE ALIEN HOARD.<br>USE ARROW KEYS OR BUTTONS TO MOVE & SHOOT.
                </p>
                <button id="actionButton" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs sm:text-sm rounded-lg shadow-lg transition-transform transform hover:scale-105 active:scale-95 cursor-pointer border-2 border-emerald-300">
                    START GAME
                </button>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-7xl flex flex-col items-center gap-1 z-20">
        <div class="flex justify-between w-full px-2">
            <div class="flex gap-2">
                <button id="leftBtn" class="w-14 h-12 sm:w-16 sm:h-16 bg-zinc-800 hover:bg-zinc-700 active:bg-emerald-600 border-2 border-zinc-600 rounded-xl flex items-center justify-center text-lg shadow-md text-emerald-400 transition-colors">◀</button>
                <button id="rightBtn" class="w-14 h-12 sm:w-16 sm:h-16 bg-zinc-800 hover:bg-zinc-700 active:bg-emerald-600 border-2 border-zinc-600 rounded-xl flex items-center justify-center text-lg shadow-md text-emerald-400 transition-colors">▶</button>
            </div>
            <button id="shootBtn" class="w-24 h-12 sm:w-28 sm:h-16 bg-red-700 hover:bg-red-600 active:bg-red-500 border-2 border-red-400 rounded-xl flex items-center justify-center text-xs font-bold text-white shadow-md transition-colors">FIRE</button>
        </div>
        <p class="text-[8px] sm:text-[9px] text-zinc-500 text-center">KEYBOARD: [A]/[D] or [←]/[→] to Move, [SPACE] to Shoot, [P] to Pause</p>
    </footer>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // High-DPI Canvas Scaling for crisp rendering that fills container fully
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        // Initial setup after DOM load
        setTimeout(resizeCanvas, 50);

        // Game State Variables
        let score = 0;
        let hiScore = localStorage.getItem('spaceInvadersHiScore') || 0;
        document.getElementById('hiScoreVal').innerText = String(hiScore).padStart(6, '0');
        let lives = 3;
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER, VICTORY
        let level = 1;

        // Player Object
        let player = {
            x: 0,
            y: 0,
            w: 50,
            h: 22,
            speed: 6,
            dx: 0
        };

        // Bullets & Particles Arrays
        let bullets = [];
        let enemyBullets = [];
        let invaders = [];
        let barriers = [];
        let particles = [];
        let ufo = null;
        let ufoTimer = 0;

        // Controls Map
        let keys = { left: false, right: false, shoot: false };
        let spaceWasReleased = true;
        // DOM Elements for UI transitions
        const screenOverlay = document.getElementById('screenOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlaySubtitle = document.getElementById('overlaySubtitle');
        const actionButton = document.getElementById('actionButton');
        const scoreVal = document.getElementById('scoreVal');
        const hiScoreVal = document.getElementById('hiScoreVal');
        const livesContainer = document.getElementById('livesContainer');

        function initGame() {
            score = 0;
            lives = 3;
            level = 1;
            updateScoreBoard();
            resetLevel();
        }

        function resetLevel() {
            resizeCanvas();
            const logicalWidth = canvas.clientWidth || window.innerWidth;
            const logicalHeight = canvas.clientHeight || window.innerHeight;
            
            player.x = logicalWidth / 2 - player.w / 2;
            player.y = logicalHeight - 60;

            bullets = [];
            enemyBullets = [];
            particles = [];
            ufo = null;
            ufoTimer = 0;

            createInvaders();
            createBarriers();
        }

        function createInvaders() {
            invaders = [];
            const rows = 5;
            const cols = 12;
            const spacingX = 42;
            const spacingY = 32;
            const totalWidth = cols * spacingX;
            const logicalWidth = canvas.clientWidth || window.innerWidth;
            const startX = Math.max(20, (logicalWidth - totalWidth) / 2);
            const startY = 60;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    invaders.push({
                        x: startX + c * spacingX,
                        y: startY + r * spacingY,
                        w: 26,
                        h: 18,
                        row: r,
                        alive: true,
                        frame: 0
                    });
                }
            }
        }

        function createBarriers() {
            barriers = [];
            const logicalWidth = canvas.clientWidth || window.innerWidth;
            const logicalHeight = canvas.clientHeight || window.innerHeight;
            const barrierCount = 4;
            const spacing = logicalWidth / (barrierCount + 1);

            for (let i = 1; i <= barrierCount; i++) {
                barriers.push({
                    x: spacing * i - 35,
                    y: logicalHeight - 130,
                    w: 70,
                    h: 25,
                    health: 18 // durability blocks
                });
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
            if (e.code === 'Space') {
                if (spaceWasReleased && gameState === 'PLAYING') {
                    shootBullet();
                    spaceWasReleased = false;
                }
                keys.shoot = true;
                e.preventDefault();
            }
            if (e.code === 'KeyP') {
                togglePause();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
            if (e.code === 'Space') {
                keys.shoot = false;
                spaceWasReleased = true;
            }
        });

        // Touch Control Listeners
        let rapidFireInterval = null;
        const setupTouchButton = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => { keys[keyName] = true; });
            btn.addEventListener('mouseup', () => { keys[keyName] = false; });
            btn.addEventListener('mouseleave', () => { keys[keyName] = false; });
        };

        setupTouchButton('leftBtn', 'left');
        setupTouchButton('rightBtn', 'right');

        const shootBtn = document.getElementById('shootBtn');
        const startRapidFire = (e) => {
            if(e) e.preventDefault();
            if(gameState === 'PLAYING') {
                shootBullet();
                if(!rapidFireInterval) {
                    rapidFireInterval = setInterval(() => {
                        if(gameState === 'PLAYING') {
                            shootBullet();
                        } else {
                            stopRapidFire();
                        }
                    }, 80);
                }
            }
        };

        const stopRapidFire = (e) => {
            if(e) e.preventDefault();
            if(rapidFireInterval) {
                clearInterval(rapidFireInterval);
                rapidFireInterval = null;
            }
        };

        shootBtn.addEventListener('touchstart', startRapidFire);
        shootBtn.addEventListener('touchend', stopRapidFire);
        shootBtn.addEventListener('mousedown', startRapidFire);
        shootBtn.addEventListener('mouseup', stopRapidFire);
        shootBtn.addEventListener('mouseleave', stopRapidFire);

        actionButton.addEventListener('click', () => {
            if (gameState === 'START' || gameState === 'GAMEOVER' || gameState === 'VICTORY') {
                initGame();
                gameState = 'PLAYING';
                screenOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                overlayTitle.innerText = "GAME PAUSED";
                overlaySubtitle.innerText = "PRESS [P] OR CLICK RESUME TO CONTINUE";
                actionButton.innerText = "RESUME";
                screenOverlay.classList.remove('opacity-0', 'pointer-events-none');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                screenOverlay.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function shootBullet() {
            if (bullets.length < 12) {
                const logicalWidth = canvas.clientWidth || window.innerWidth;
                bullets.push({
                    x: player.x + player.w / 2 - 2,
                    y: player.y,
                    w: 5,
                    h: 14,
                    speed: 12
                });
            }
        }

        let alienDirection = 1;
        let alienSpeed = 1.2;
        let alienMoveTimer = 0;
        let alienDropInterval = 28;
        let autoFireTimer = 0;
        function update() {
            if (gameState !== 'PLAYING') return;

            const logicalWidth = canvas.clientWidth || window.innerWidth;
            const logicalHeight = canvas.clientHeight || window.innerHeight;

            // Player movement
            if (keys.left && player.x > 10) {
                player.x -= player.speed;
            }
            if (keys.right && player.x < logicalWidth - player.w - 10) {
                player.x += player.speed;
            }

            // Rapid fire when space key is held down
            if (keys.shoot && gameState === 'PLAYING') {
                autoFireTimer++;
                if (autoFireTimer % 5 === 0) {
                    shootBullet();
                }
            } else {
                autoFireTimer = 0;
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Update Enemy Bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].speed;
                // Check collision with player
                if (
                    enemyBullets[i].x < player.x + player.w &&
                    enemyBullets[i].x + enemyBullets[i].w > player.x &&
                    enemyBullets[i].y < player.y + player.h &&
                    enemyBullets[i].y + enemyBullets[i].h > player.y
                ) {
                    enemyBullets.splice(i, 1);
                    triggerExplosion(player.x + player.w/2, player.y + player.h/2, '#ef4444');
                    lives--;
                    updateScoreBoard();
                    if (lives <= 0) {
                        endGame(false);
                    } else {
                        player.x = logicalWidth / 2 - player.w / 2;
                    }
                    continue;
                }

                // Check collision with barriers
                let hitBarrier = false;
                for (let b of barriers) {
                    if (
                        b.health > 0 &&
                        enemyBullets[i].x < b.x + b.w &&
                        enemyBullets[i].x + enemyBullets[i].w > b.x &&
                        enemyBullets[i].y < b.y + b.h &&
                        enemyBullets[i].y + enemyBullets[i].h > b.y
                    ) {
                        b.health--;
                        hitBarrier = true;
                        break;
                    }
                }
                if (hitBarrier) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (enemyBullets[i].y > logicalHeight) {
                    enemyBullets.splice(i, 1);
                }
            }

            // Check bullet-invader collisions & barrier collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bulletRemoved = false;

                // Check barriers
                for (let b of barriers) {
                    if (
                        b.health > 0 &&
                        bullets[i].x < b.x + b.w &&
                        bullets[i].x + bullets[i].w > b.x &&
                        bullets[i].y < b.y + b.h &&
                        bullets[i].y + bullets[i].h > b.y
                    ) {
                        b.health--;
                        bullets.splice(i, 1);
                        bulletRemoved = true;
                        break;
                    }
                }
                if (bulletRemoved) continue;

                // Check invaders
                for (let inv of invaders) {
                    if (inv.alive) {
                        if (
                            bullets[i].x < inv.x + inv.w &&
                            bullets[i].x + bullets[i].w > inv.x &&
                            bullets[i].y < inv.y + inv.h &&
                            bullets[i].y + bullets[i].h > inv.y
                        ) {
                            inv.alive = false;
                            bullets.splice(i, 1);
                            triggerExplosion(inv.x + inv.w/2, inv.y + inv.h/2, '#10b981');
                            score += (5 - inv.row) * 20;
                            updateScoreBoard();
                            bulletRemoved = true;
                            break;
                        }
                    }
                }

                // Check UFO
                if (!bulletRemoved && ufo) {
                    if (
                        bullets[i].x < ufo.x + ufo.w &&
                        bullets[i].x + bullets[i].w > ufo.x &&
                        bullets[i].y < ufo.y + ufo.h &&
                        bullets[i].y + bullets[i].h > ufo.y
                    ) {
                        score += 300;
                        updateScoreBoard();
                        triggerExplosion(ufo.x + ufo.w/2, ufo.y + ufo.h/2, '#eab308');
                        ufo = null;
                        bullets.splice(i, 1);
                    }
                }
            }

            // Move Invaders periodically
            alienMoveTimer++;
            const activeInvaders = invaders.filter(inv => inv.alive);
            if (activeInvaders.length === 0) {
                level++;
                createInvaders();
                alienSpeed += 0.5;
                return;
            }

            let dropLimit = Math.max(5, alienDropInterval - level * 3);
            if (alienMoveTimer > dropLimit) {
                alienMoveTimer = 0;
                let hitEdge = false;

                for (let inv of activeInvaders) {
                    inv.x += alienSpeed * alienDirection;
                    if (inv.x + inv.w > logicalWidth - 30 || inv.x < 30) {
                        hitEdge = true;
                    }
                    if (inv.y + inv.h >= player.y) {
                        endGame(false);
                    }
                }

                if (hitEdge) {
                    alienDirection *= -1;
                    for (let inv of invaders) {
                        inv.y += 20;
                    }
                }

                // Random enemy shooting
                if (Math.random() < 0.4 + level * 0.05) {
                    const shooter = activeInvaders[Math.floor(Math.random() * activeInvaders.length)];
                    enemyBullets.push({
                        x: shooter.x + shooter.w / 2 - 2,
                        y: shooter.y + shooter.h,
                        w: 5,
                        h: 12,
                        speed: 4 + level * 0.5
                    });
                }
            }

            // UFO Spawn logic
            if (!ufo) {
                ufoTimer++;
                if (ufoTimer > 600 && Math.random() < 0.01) {
                    ufo = {
                        x: -60,
                        y: 30,
                        w: 60,
                        h: 22,
                        speed: 2.5
                    };
                    ufoTimer = 0;
                }
            } else {
                ufo.x += ufo.speed;
                if (ufo.x > logicalWidth) {
                    ufo = null;
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function triggerExplosion(x, y, color) {
            for (let i = 0; i < 14; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color: color
                });
            }
        }

        function updateScoreBoard() {
            scoreVal.innerText = String(score).padStart(6, '0');
            if (score > hiScore) {
                hiScore = score;
                localStorage.setItem('spaceInvadersHiScore', hiScore);
                hiScoreVal.innerText = String(hiScore).padStart(6, '0');
            }
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            livesContainer.innerText = hearts.trim();
        }

        function endGame(won) {
            gameState = won ? 'VICTORY' : 'GAMEOVER';
            overlayTitle.innerText = won ? "VICTORY!" : "GAME OVER";
            overlaySubtitle.innerText = `FINAL SCORE: ${score}\nPRESS BUTTON TO PLAY AGAIN`;
            actionButton.innerText = "PLAY AGAIN";
            screenOverlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function draw() {
            const logicalWidth = canvas.clientWidth || window.innerWidth;
            const logicalHeight = canvas.clientHeight || window.innerHeight;

            if (canvas.width !== logicalWidth * window.devicePixelRatio || canvas.height !== logicalHeight * window.devicePixelRatio) {
                canvas.width = logicalWidth * window.devicePixelRatio;
                canvas.height = logicalHeight * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Draw Background Starfield
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(150, 100, 2, 2);
            ctx.fillRect(420, 180, 2, 2);
            ctx.fillRect(700, 90, 2, 2);
            ctx.fillRect(250, 450, 2, 2);
            ctx.fillRect(600, 520, 2, 2);

            // Draw Player Cannon
            ctx.fillStyle = '#10b981';
            ctx.fillRect(player.x, player.y + 12, player.w, 10);
            ctx.fillRect(player.x + player.w / 2 - 5, player.y, 10, 12);

            // Draw Bullets
            ctx.fillStyle = '#facc15';
            for (let b of bullets) {
                ctx.fillRect(b.x, b.y, b.w, b.h);
            }

            // Draw Enemy Bullets
            ctx.fillStyle = '#ef4444';
            for (let eb of enemyBullets) {
                ctx.fillRect(eb.x, eb.y, eb.w, eb.h);
            }

            // Draw Invaders (Slightly larger with detailed retro look)
            for (let inv of invaders) {
                if (!inv.alive) continue;
                ctx.fillStyle = inv.row === 0 ? '#ec4899' : inv.row === 1 ? '#a855f7' : inv.row === 2 ? '#3b82f6' : '#10b981';
                ctx.fillRect(inv.x, inv.y, inv.w, inv.h);
                ctx.fillStyle = '#000000';
                ctx.fillRect(inv.x + 5, inv.y + 5, 4, 4);
                ctx.fillRect(inv.x + inv.w - 9, inv.y + 5, 4, 4);
            }

            // Draw UFO
            if (ufo) {
                ctx.fillStyle = '#eab308';
                ctx.fillRect(ufo.x, ufo.y + 8, ufo.w, ufo.h - 8);
                ctx.fillRect(ufo.x + 16, ufo.y, ufo.w - 32, 8);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(ufo.x + 10, ufo.y + 14, 5, 5);
                ctx.fillRect(ufo.x + ufo.w - 15, ufo.y + 14, 5, 5);
            }

            // Draw Barriers (Bunkers)
            for (let b of barriers) {
                if (b.health <= 0) continue;
                ctx.fillStyle = `rgba(16, 185, 129, ${b.health / 18})`;
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.clearRect(b.x + 20, b.y + b.h - 12, 30, 12);
            }

            // Draw Particles
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, 3.5, 3.5);
                ctx.globalAlpha = 1.0;
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
